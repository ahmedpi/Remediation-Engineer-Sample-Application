server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
    }

    location /fauxpay/ {
        proxy_pass http://fauxpay:4000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
