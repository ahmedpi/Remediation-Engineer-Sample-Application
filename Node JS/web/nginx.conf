# Per-IP rate limiting.
#
# These zones sit at http context — this file is pulled in by the stock
# nginx.conf's `include /etc/nginx/conf.d/*.conf;`, which is inside `http`, so
# `limit_req_zone` must be declared here, outside the server block below. Each
# is applied to its own location further down.

# Ordinary API traffic. Generous: a single page can fan out several calls, and
# access tokens expire every 15 minutes, so refreshes are routine.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;

# Credential endpoints.
limit_req_zone $binary_remote_addr zone=api_auth:5m rate=10r/m;

# The FauxPay relay (training only — see the location block below).
limit_req_zone $binary_remote_addr zone=fauxpay:1m rate=20r/m;

# Static SPA assets.
limit_req_zone $binary_remote_addr zone=static:10m rate=40r/s;

# Plain HTTP exists only to redirect. All real traffic is TLS 1.2 below.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Self-signed, generated at container startup (see generate-cert.sh) —
    # training-only stand-in for a CA-issued cert terminated at a real edge
    # proxy/load balancer. Client-to-proxy traffic is TLS 1.2 only.
    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_protocols       TLSv1.2;

    # 429 is the accurate status for a throttled client; nginx defaults to 503,
    # which reads as "the server is broken" rather than "you are going too fast".
    limit_req_status 429;
    error_page 429 = @too_many_requests;

    # The SPA's fetch client parses every /api/ response as JSON, so hand it
    # JSON rather than nginx's stock HTML error page.
    location @too_many_requests {
        default_type application/json;
        return 429 '{"error":"Too many requests. Please slow down and try again."}';
    }

    # Login and registration, throttled hard. This is a regex location, so it
    # takes precedence over the /api/ prefix below. proxy_pass carries no URI
    # part because nginx forbids that in a regex location — the request URI is
    # passed through unchanged, which is what the /api/ block does anyway.
    #
    # Deliberately excludes /api/auth/refresh: it is not a credential endpoint,
    # it fires on every reload and every 15-minute expiry, and it is already
    # single-use, so it belongs under the general limit.
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
    }

    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
    }

    # TRAINING ONLY — relays the fictional FauxPay processor onto this origin so
    # the whole demo runs from one published port (8080) with no CORS config.
    #
    # Be aware of what this prefix match means: every FauxPay route is reachable
    # from wherever this port is exposed, including /fauxpay/charge and
    # /fauxpay/refund. Those two still require the merchant secret key, so they
    # are not anonymously callable, but they have no legitimate caller here
    # either — the API service calls FauxPay over the internal Docker network
    # (api/src/services/fauxpayClient.js) and never through this proxy.
    #
    # PRODUCTION: this location block is not deployed. The browser talks to the
    # real processor's domain directly via its JS SDK, and server-side charge and
    # refund calls leave the API service as egress-only TLS. No inbound path from
    # the internet to the processor exists through our infrastructure. If a
    # same-origin proxy were ever genuinely needed, it would be a single exact
    # match (`location = /fauxpay/tokenize`) with rate limiting and access_log
    # off, never a prefix match over the processor's full API surface.
    location /fauxpay/ {
        limit_req zone=fauxpay burst=10 nodelay;
        proxy_pass https://fauxpay:4000/;
        proxy_set_header Host $host;

        # Proxy-to-FauxPay hop is TLS 1.2 too. FauxPay's cert is self-signed
        # (see fauxpay/docker-entrypoint.sh), so it's shared into this
        # container via the fauxpay_certs volume and trusted explicitly
        # rather than skipping verification.
        proxy_ssl_protocols TLSv1.2;
        proxy_ssl_trusted_certificate /certs/fauxpay/cert.pem;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 1;
        proxy_ssl_name fauxpay;
    }

    location / {
        limit_req zone=static burst=80 nodelay;
        try_files $uri /index.html;
    }
}
