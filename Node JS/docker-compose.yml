services:
  web:
    build: ./web
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      # Read-only: nginx only needs FauxPay's cert to verify the upstream TLS
      # connection in the /fauxpay/ relay, never its private key.
      - fauxpay_certs:/certs/fauxpay:ro
    depends_on:
      api:
        condition: service_started
      fauxpay:
        # Must wait for FauxPay's cert to actually exist in the shared volume
        # before nginx starts, since proxy_ssl_trusted_certificate is loaded
        # at startup — service_started alone races the cert generation.
        condition: service_healthy

  api:
    build: ./api
    env_file: .env
    environment:
      DB_HOST: db
      FAUXPAY_BASE_URL: https://fauxpay:4000
      # Node's fetch (undici) reads this to extend its trusted root store, so
      # the outbound call to FauxPay's self-signed cert verifies instead of
      # failing or silently skipping validation.
      NODE_EXTRA_CA_CERTS: /certs/fauxpay/cert.pem
    volumes:
      - fauxpay_certs:/certs/fauxpay:ro
    depends_on:
      db:
        condition: service_healthy
      fauxpay:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  migrate:
    build: ./api
    command: ["npm", "run", "migrate"]
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  # Training database — a disposable container holding seed data only. The
  # credential defaults below are a boot convenience and do not survive into
  # production, where Postgres is a managed instance reached over TLS on a
  # private subnet, its password is held in a secrets manager and injected at
  # runtime (unique per environment, rotated on a schedule), and the application
  # connects as a least-privilege role rather than the schema owner. No working
  # default exists in deployed config — an unset credential fails the connection.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-widgetshop}
      POSTGRES_USER: ${DB_USER:-widgetshop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-widgetshop}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-widgetshop}"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  # Fictional payment processor, local to this training stack. There is no
  # production equivalent of this service: the deployed API calls the real
  # processor's hosted API instead. No `:-` default here: FAUXPAY_API_KEY must
  # come from .env (see .env.example), and fauxpay/src/server.js exits at
  # startup if it is unset — in production the processor's secret key comes
  # from a secrets manager, is injected at runtime into the api service only,
  # and is rotated on a schedule.
  fauxpay:
    build: ./fauxpay
    environment:
      FAUXPAY_API_KEY: ${FAUXPAY_API_KEY:?FAUXPAY_API_KEY must be set}
    volumes:
      # Read-write: this is the only container that ever writes the cert/key
      # (see docker-entrypoint.sh). Others mount it read-only to trust it.
      - fauxpay_certs:/certs
    healthcheck:
      # Plain `wget`'s HTTPS support varies by Alpine build, so this uses
      # Node's own https module (always present in this image) instead.
      # rejectUnauthorized:false is fine here — it's FauxPay checking its own
      # self-signed cert, only to confirm the TLS listener answers so
      # dependents can safely load the cert this healthcheck already proves
      # exists.
      test:
        - CMD
        - node
        - -e
        - "require('https').get({host:'localhost',port:4000,path:'/health',rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "4000"

volumes:
  db_data:
  fauxpay_certs:
