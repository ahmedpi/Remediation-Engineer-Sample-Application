services:
  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api
      - fauxpay

  api:
    build: ./api
    env_file: .env
    environment:
      DB_HOST: db
      FAUXPAY_BASE_URL: http://fauxpay:4000
    depends_on:
      db:
        condition: service_healthy
      fauxpay:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  migrate:
    build: ./api
    command: ["npm", "run", "migrate"]
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  # Training database — a disposable container holding seed data only. The
  # credential defaults below are a boot convenience and do not survive into
  # production, where Postgres is a managed instance reached over TLS on a
  # private subnet, its password is held in a secrets manager and injected at
  # runtime (unique per environment, rotated on a schedule), and the application
  # connects as a least-privilege role rather than the schema owner. No working
  # default exists in deployed config — an unset credential fails the connection.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-widgetshop}
      POSTGRES_USER: ${DB_USER:-widgetshop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-widgetshop}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-widgetshop}"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  # Fictional payment processor, local to this training stack. There is no
  # production equivalent of this service: the deployed API calls the real
  # processor's hosted API instead. The key below is a fixed training default so
  # the stack boots with no setup — in production the processor's secret key
  # comes from a secrets manager, is injected at runtime into the api service
  # only, is rotated on a schedule, and has no working fallback value anywhere in
  # the repo or the compose file.
  fauxpay:
    build: ./fauxpay
    environment:
      FAUXPAY_API_KEY: ${FAUXPAY_API_KEY:-fauxpay_test_key}
    expose:
      - "4000"

volumes:
  db_data:
